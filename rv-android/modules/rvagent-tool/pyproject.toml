[tool.poetry]
name = "rvagent-tool"
version = "0.1.0"
description = "RV-Agent tool wrapper for rv-platform integration"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rvagent_tool", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
rv-agent = {path = "../rv-agent", develop = true}
rv-tools = {path = "../rv-tools", develop = true}
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"

# Plugin registration for rv-tools
[tool.poetry.plugins."rv_tools.plugins"]
rvagent = "rvagent_tool.tools.rvagent.tool:RVAgentTool"

[tool.pytest.ini_options]
addopts = "--cov=src"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
