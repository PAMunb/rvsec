[tool.poetry]
name = "rv-android-core"
version = "0.1.0"
description = "Core utilities and domain models for RV-Android"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_android_core", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
androguard = "3.4.0a1"
psutil = "^7.0.0"
networkx = "^3.5"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "integration: Integration tests that require external dependencies",
    "slow: Slow running tests",
    "performance: marks tests as performance tests (may be slow)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"