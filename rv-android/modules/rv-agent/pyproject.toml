[tool.poetry]
name = "rv-agent"
version = "0.1.0"
description = "Autonomous Android testing agent with LangChain and SGLang"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

# Core dependencies
rv-android-core = {path = "../rv-android-core", develop = true}
rv-screen-parser = {path = "../rv-screen-parser", develop = true}
rv-uiautomator = {path = "../rv-uiautomator", develop = true}
rv-static-analysis = {path = "../rv-static-analysis", develop = true}

# LangChain ecosystem (SGLang via OpenAI-compatible API)
# Updated 2026-01-06 - using 0.3.x series for LangGraph compatibility
langchain = "^0.3"
langchain-core = "^0.3"
langchain-openai = "^0.3"

# LangGraph for workflow
langgraph = "^0.3"
langgraph-checkpoint = "^2.0"
langgraph-checkpoint-sqlite = "^2.0"

# Utils
requests = "^2.32.0"
httpx = "^0.28.0"
pydantic = "^2.9.0"
pillow = "^10.0.0"
python-dotenv = "^1.0.0"
backoff = "^2.2.1"
scipy = "^1.14.0"
faker = "^29.0.0"

# CLI
click = "^8.1.0"

[tool.poetry.scripts]
rv-agent = "rv_agent.cli.main:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^7.0.0"
hypothesis = "^6.100.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
