[tool.poetry]
name = "rv-agent"
version = "0.1.0"
description = "Autonomous Android testing agent with LangChain and ReAct pattern"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# Core dependencies - process isolation funciona
rv-android-core = {path = "../rv-android-core", develop = true}
rv-uiautomator = {path = "../rv-uiautomator", develop = true}

# LangChain ecosystem (LATEST 2025 versions)
langchain = "^0.3.27"     # Latest stable
langchain-core = "^0.3.26" # Latest core
langchain-ollama = "^0.3.7"  # Required for tool-calling
langchain-anthropic = {version = "^0.2.0", optional = true}

# HuggingFace ecosystem (LATEST 2025 versions for AI/LLM)
huggingface-hub = "^0.30.0"   # Compatible hub version
transformers = "^4.40.0"      # Compatible transformers with vision support
torch = "^2.1.0"              # Compatible stable PyTorch
accelerate = "^1.0.0"         # Compatible acceleration

# Utils
requests = "^2.32.0"  # Para PlatformClient opcional
pydantic = "^2.9.0"
pillow = "^10.0.0"    # Para dimensões de screenshot
python-dotenv = "^1.0.0"

# CLI
click = "^8.1.0"
peft = "^0.17.1"
torchvision = "^0.23.0"
backoff = "^2.2.1"
bitsandbytes = ">=0.44.0"

[tool.poetry.extras]
ollama = ["langchain-ollama"]
anthropic = ["langchain-anthropic"]

[tool.poetry.scripts]
rv-agent = "rv_agent.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"