[tool.poetry]
name = "rv-agent"
version = "0.1.0"
description = "Autonomous Android testing agent with LangChain and ReAct pattern"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

# Core dependencies - process isolation funciona
rv-android-core = {path = "../rv-android-core", develop = true}
rv-screen-parser = {path = "../rv-screen-parser", develop = true}
rv-uiautomator = {path = "../rv-uiautomator", develop = true}

# LangChain ecosystem (VERSÕES MAIS RECENTES - Outubro 2025)
langchain = "^1.0.2"           # Stable 1.0
langchain-core = "^1.0.1"      # Stable 1.0
langchain-ollama = "^1.0.0"    # Stable 1.0 - tool-calling support
langchain-anthropic = {version = "^1.0.0", optional = true}

# Utils
requests = "^2.32.0"  # Para PlatformClient opcional
pydantic = "^2.9.0"
pillow = "^10.0.0"    # Para dimensões de screenshot
python-dotenv = "^1.0.0"

# CLI
click = "^8.1.0"
backoff = "^2.2.1"
langgraph = "^1.0.1"
scipy = "^1.16.2"
langgraph-checkpoint = "^3.0.0"
langgraph-checkpoint-sqlite = "^3.0.0"
langchain-community = "^0.4.1"
langsmith = "^0.4.38"
gradio = "^5.49.1"
ollama = "^0.6.0"

[tool.poetry.extras]
anthropic = ["langchain-anthropic"]

[tool.poetry.scripts]
rv-agent = "rv_agent.cli.main:cli"

[tool.poetry.group.dev.dependencies]
langgraph-cli = {extras = ["inmem"], version = "^0.4.4"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"