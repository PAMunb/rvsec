[project]
name = "rv-static-analysis"
version = "0.1.0"
description = "Static analysis tools integration (GATOR, GESDA, REACH) and result parsing"
authors = [{name = "RV-Android Team"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rv-android-core",
    "pydantic>=2.9.0",
]

[project.scripts]
rv-static-analysis = "rv_static_analysis.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
rv-android-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rv_static_analysis"]

[tool.pytest.ini_options]
addopts = "--cov=src"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
# show_missing = true
# fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
