# modules/rv-instrumentation/pyproject.toml
[tool.poetry]
name = "rv-instrumentation"
version = "0.1.0"
description = "APK instrumentation with runtime verification monitors"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_instrumentation", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
rv-android-core = {path = "../rv-android-core", develop = true}
rv-monitor-generator = {path = "../rv-monitor-generator", develop = true}
# Adicione dependências específicas da instrumentação se houver

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"

[tool.poetry.scripts]
rv-instrumentation = "rv_instrumentation.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"