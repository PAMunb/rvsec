[tool.poetry]
name = "rv-tools"
version = "0.1.0"
description = "Tool registry and plugin system for monitored operations testing"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_tools", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"  # v5.0.0 has known buffer API issue in teardown

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-config=pyproject.toml"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "src/rv_tools/builtin/qtesting/src/*"
]
parallel = false
data_file = ".coverage"

#[tool.coverage.report]
# show_missing = true
# fail_under = 80

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"