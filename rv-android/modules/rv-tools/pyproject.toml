[tool.poetry]
name = "rv-tools"
version = "0.1.0"
description = "Tool registry and plugin system for monitored operations testing"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_tools", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
pydantic = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"