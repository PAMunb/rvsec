# Quarantine patterns (NOT weaving excludes for aop.xml — see gh50 Section 16).
#
# Classes matching these patterns are temporarily MOVED to tmp_dir/.quarantine/
# before ajc / frame_computer / d8 run, and then restored into tmp_dir before
# the final APK is packaged. Goal: prevent ABORT-level failures in BCEL (ajc)
# and R8 (d8) on bytecode patterns these tools cannot reliably rewrite.
#
# Scope trade-off: quarantined classes ship in the APK with their original
# bytecode, but their internal JCA calls are not monitored. MOP specs use
# call()-semantics, so app-code calls INTO these libraries are still captured
# at the caller site. See gh50 design.md D-QUARANTINE.
#
# Each pattern is a relative glob under tmp_dir (e.g. "okio/**/*.class"
# matches tmp_dir/okio/anything/*.class). App classes matching a pattern
# are left in place (a WARNING is logged) so the user's own code is never
# un-instrumented.
#
# Keep the list narrow: add entries only after an empirical crasher is
# identified in an instrument_errors.json bucket.
#
# The list below is divided into two historical waves:
#   - gh50 §16 (Apr 2026, JCA-400 modern F-Droid dataset)
#   - gh50 §19 (Apr 2026, JCA-557 legacy F-Droid ~2020 dataset)
# Both waves use the same mechanism (`__quarantine_problematic_classes` +
# `__restore_quarantined_classes` in rvandroid.py) and the same semantic
# trade-off (internal library JCA calls not monitored; app → library calls
# still captured at caller site by the MOP `call()` semantics).
patterns:
  # ---------- gh50 §16 — first wave (JCA-400 modern dataset) ----------
  # okio — network I/O library used by OkHttp, Retrofit, coroutines.
  # Classes like okio.Buffer, okio.HashingSource, okio.ByteString trigger
  # BCEL Index -1 on the HMAC / hashing codepaths.
  - "okio/**/*.class"
  # Media3 datasource layer (and DRM) — AesFlushingCipher and companions
  # repeatedly crash ajc / d8 with the same "Index -1" signature.
  - "androidx/media3/datasource/**/*.class"
  - "androidx/media3/exoplayer/drm/**/*.class"
  # Apache Tika parser subtree — CryptoParser is the top offender
  # (13/37 ajc stackmap_error failures in the JCA-400 run).
  - "org/apache/tika/**/*.class"
  # Google Play Licensing AES obfuscator — triggers BCEL crash reliably.
  - "com/google/android/vending/licensing/AESObfuscator*.class"
  # BouncyCastle JCA provider — Shacal2$AlgParamGen and siblings trip the
  # same BCEL / R8 "Index -1" bug during ajc weaving / d8 DEX compilation.
  # Added during Phase B v5 follow-up to recover com.vermont.possin.apk.
  - "org/bouncycastle/**/*.class"

  # ---------- gh50 §19 — second wave (JCA-557 oldset dataset) ----------
  # SpongyCastle — Android fork of BouncyCastle (deprecated in 2020).
  # Dominant JCA provider in F-Droid apps circa 2020. Classes such as
  # `Camellia$AlgParamGen`, `JcePublicKeyKeyEncryptionMethodGenerator`
  # crash d8 AIOOBE (13 APKs in JCA-557 failure bucket).
  - "org/spongycastle/**/*.class"
  # jsoup — HTML parser. `HttpConnection$Response.initUnSecureTSL()`
  # crashes d8 reliably (10 APKs).
  - "org/jsoup/**/*.class"
  # Lingala zip4j — compression + PBKDF2 MAC-based PRF; d8 AIOOBE (8 APKs).
  - "net/lingala/zip4j/**/*.class"
  # Trilead ssh2 — SSH2 protocol library; HMAC digest classes crash (6 APKs).
  - "com/trilead/ssh2/**/*.class"
  # Conscrypt — Google fork of BoringSSL for TLS. OpenSSLCipher variants
  # trip the same d8 bug (6 APKs).
  - "org/conscrypt/**/*.class"
  # Mseberas Android HttpClient — NTLMEngineImpl crashes (5 APKs).
  - "cz/msebera/android/httpclient/**/*.class"
  # JSch (JCraft) — SSH library, AES192CBC and ARCFOUR128 variants (5 APKs).
  - "com/jcraft/jsch/**/*.class"
  # Tink — widen the Apr-2026 narrow `AesGcmJce*` pattern to the whole
  # crypto subtree. `AesCtrHmacStreaming$AesCtrHmacStreamDecrypter`
  # and other subtle/streaming classes crash in JCA-557 (8 APKs).
  - "com/google/crypto/tink/**/*.class"
  # ExoPlayer v2 crypto datasource — AesFlushingCipher outside media3
  # namespace. 8 APKs in JCA-557.
  - "com/google/android/exoplayer2/upstream/crypto/**/*.class"
  # sshj — modern SSH library; keyprovider classes crash (2 APKs).
  - "net/schmizz/sshj/**/*.class"
  # PircBot — IRC library (2 APKs).
  - "org/jibble/pircbot/**/*.class"
  # Flutter inappwebview — embedded webview util (2 APKs).
  - "com/pichillilorenzo/flutter_inappwebview/**/*.class"
  # iTextPDF — PDF generation, both v5 (com/itextpdf/text) and v7
  # (com/itextpdf/kernel) subtree (2 APKs).
  - "com/itextpdf/**/*.class"
  # kevinsawicki HttpRequest — legacy HTTP client (2 APKs).
  - "com/github/kevinsawicki/http/**/*.class"
  # bitcoinj — Bitcoin protocol, BIP47PaymentCode and companions (2 APKs).
  - "org/bitcoinj/**/*.class"
  # LeakCanary — memory leak detector; ajc BCException `Whilst processing
  # type 'Lleakca...'` on obfuscated LeakCanary internals (among the
  # 19 BCException APKs).
  - "com/squareup/leakcanary/**/*.class"
  # Apache http legacy — pre-HttpClient5 HTTP (1 APK).
  - "org/apache/http/**/*.class"
