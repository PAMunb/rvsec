[project]
name = "aperv-tool"
version = "0.1.0"
description = "APE-RV tool wrapper for rv-platform integration"
authors = [{name = "RV-Android Team"}]
requires-python = ">=3.12"
dependencies = [
    "rv-android-core",
    "rv-tools",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "black>=26.1.0",
    "isort>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
rv-android-core = { workspace = true }
rv-tools = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=src"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aperv_tool"]
