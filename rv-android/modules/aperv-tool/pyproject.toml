[project]
name = "aperv-tool"
version = "0.1.0"
description = "APE-RV tool wrapper for rv-platform integration"
readme = "README.md"
authors = [{name = "RV-Android Team"}]
requires-python = ">=3.12"
dependencies = [
    "rv-android-core",
    "rv-tools",
    # The analysis layer's tidy carrier, numerics and estimator stack. Declared
    # here rather than inherited transitively from a sibling module: the
    # campaign analysis is a first-class consumer of these versions, and a
    # version drift arriving through someone else's dependency set would move
    # the parity tests without naming a cause.
    "pandas>=3.0.0",
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    # Carries the negative-binomial GLM. Imported lazily inside
    # analysis/estimators/count_glm.py so the three shipped readers and the
    # collection path never pay its import cost.
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "black>=26.1.0",
    "isort>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
rv-android-core = { workspace = true }
rv-tools = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=src"
markers = [
    "slow: reads or hashes the multi-gigabyte FIXTURE-REAL trees",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aperv_tool"]
