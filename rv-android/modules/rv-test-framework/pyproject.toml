[tool.poetry]
name = "rv-test-framework"
version = "0.1.0"
description = "RV-Android Test Framework for evaluating different configurations of AI-driven Android testing tools"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_test_framework", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
rv-platform = {path = "../rv-platform", develop = true}
rv-llm = {path = "../rv-llm", develop = true}
rv-tools = {path = "../rv-tools", develop = true}
rvandroid-tool = {path = "../rvandroid-tool", develop = true}
rv-coverage = {path = "../rv-coverage", develop = true}
rv-static-analysis = {path = "../rv-static-analysis", develop = true}
click = "^8.1.7"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.12.1"
flake8 = "^6.1.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
rv-test-framework = "rv_test_framework.cli.commands:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"