[tool.poetry]
name = "rv-agent-validation"
version = "0.1.0"
description = "Validation framework for RV-Agent experiments"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_agent_validation", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

# Core dependencies
rv-android-core = {path = "../rv-android-core", develop = true}
rv-agent = {path = "../rv-agent", develop = true}
rv-static-analysis = {path = "../rv-static-analysis", develop = true}
rv-screen-parser = {path = "../rv-screen-parser", develop = true}

# Preprocessing dependencies (for APK instrumentation)
rv-monitor-generator = {path = "../rv-monitor-generator", develop = true}
rv-instrumentation = {path = "../rv-instrumentation", develop = true}

# Statistics
scipy = "^1.14.0"

# Optimization (for calibration)
optuna = "^3.5.0"
pandas = "^2.2.0"

# LLM (for multimodal validation)
langchain-openai = "^0.3"

# Utils
pydantic = "^2.9.0"
click = "^8.1.0"

[tool.poetry.scripts]
rv-agent-validation = "rv_agent_validation.__main__:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^7.0.0"
hypothesis = "^6.100.2"

[tool.pytest.ini_options]
addopts = "--cov=src"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
