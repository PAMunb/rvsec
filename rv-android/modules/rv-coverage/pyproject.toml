[tool.poetry]
name = "rv-coverage"
version = "0.1.0"
description = "Android logcat parsing and analysis for runtime verification"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_coverage", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
pydantic = "^2.8.0"
# Dependências específicas para parsing de logs
regex = "*"  # Para expressões regulares avançadas
python-dateutil = "*"  # Para parsing de timestamps

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"