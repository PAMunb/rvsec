[tool.poetry]
name = "rv-screen-parser"
version = "0.1.0"
description = "Android screen parsing for DroidBot and UIAutomator with visitor pattern"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rv_screen_parser", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
# Screen parsing dependencies
lxml = "*"  # Para parsing XML
beautifulsoup4 = "*"  # Para parsing HTML/XML alternativo
uiautomator2 = "^3.3.1"

# Screenshot analysis dependencies
pytesseract = "*"  # OCR functionality
opencv-python = "*"  # Computer vision and image processing
pillow = "*"  # Image manipulation
numpy = "*"  # Numerical operations

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
