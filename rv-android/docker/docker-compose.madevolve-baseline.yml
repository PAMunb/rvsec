# madevolve baseline: aperv:sata_mop × 169 APKs × 3 reps × 180s
# No LLM, no calibrated params — default sata_mop to establish
# the baseline fitness for the madevolve evolution pipeline (gh6).
#
# Usage:
#   cd rv-android
#   docker compose -f docker/docker-compose.madevolve-baseline.yml up -d
#   watch -n 60 bash scripts/monitor_comparacao.sh data/results baseline_180s
#   docker compose -f docker/docker-compose.madevolve-baseline.yml down
#
# Estimated time: ~3h (169 APKs × 3 reps × 210s / 10 containers)
# No GPU required (sata_mop does not use LLM).

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-env
    RV_TOOLS: "aperv:sata_mop"
    RV_TIMEOUTS: "180"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

services:
  bl00:
    <<: *rvandroid-base
    container_name: baseline_180s_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: baseline_180s_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/exp4_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/baseline_180s_00:/opt/rvsec/rv-android/results

  bl01:
    <<: *rvandroid-base
    container_name: baseline_180s_01
    environment:
