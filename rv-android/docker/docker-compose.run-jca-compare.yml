      RV_EXPERIMENT_NAME: jca_compare_dex_4
      RV_INSTRUMENTATION_VARIANT: "dexlib2"
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/run_jca_compare_batch_4.txt"
      RV_DELAY: "20"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKS_JCA_dexlib2:/opt/rvsec/rv-android/apks:ro
      - ../data/run_jca_compare_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/jca_compare_dex_4:/opt/rvsec/rv-android/results

  # ---------- 5 containers: ajc-instrumented APKs (paired same batches) ----------
  jca_compare_ajc_0:
    <<: *rvandroid-base
    container_name: jca_compare_ajc_0
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: jca_compare_ajc_0
      RV_INSTRUMENTATION_VARIANT: "ajc"
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/run_jca_compare_batch_0.txt"
      RV_DELAY: "25"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKS_JCA_androguard:/opt/rvsec/rv-android/apks:ro
      - ../data/run_jca_compare_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/jca_compare_ajc_0:/opt/rvsec/rv-android/results

  jca_compare_ajc_1:
    <<: *rvandroid-base
    container_name: jca_compare_ajc_1
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: jca_compare_ajc_1
      RV_INSTRUMENTATION_VARIANT: "ajc"
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/run_jca_compare_batch_1.txt"
      RV_DELAY: "30"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKS_JCA_androguard:/opt/rvsec/rv-android/apks:ro
      - ../data/run_jca_compare_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/jca_compare_ajc_1:/opt/rvsec/rv-android/results

  jca_compare_ajc_2:
    <<: *rvandroid-base
    container_name: jca_compare_ajc_2
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: jca_compare_ajc_2
      RV_INSTRUMENTATION_VARIANT: "ajc"
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/run_jca_compare_batch_2.txt"
      RV_DELAY: "35"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKS_JCA_androguard:/opt/rvsec/rv-android/apks:ro
      - ../data/run_jca_compare_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/jca_compare_ajc_2:/opt/rvsec/rv-android/results

  jca_compare_ajc_3:
    <<: *rvandroid-base
    container_name: jca_compare_ajc_3
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: jca_compare_ajc_3
      RV_INSTRUMENTATION_VARIANT: "ajc"
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/run_jca_compare_batch_3.txt"
      RV_DELAY: "40"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKS_JCA_androguard:/opt/rvsec/rv-android/apks:ro
      - ../data/run_jca_compare_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/jca_compare_ajc_3:/opt/rvsec/rv-android/results

  jca_compare_ajc_4:
    <<: *rvandroid-base
