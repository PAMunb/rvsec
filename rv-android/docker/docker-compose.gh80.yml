# Validação E2E da change gh80-compact-static-analysis-json (tasks 3.2/3.3/3.5).
#
# Alvo único: org.quantumbadger.redreader_117 — o único JSON acima do teto de ~32 MB
# do guard Java (MopData.java:202) nos 181 APKs do cmpma. Antes desta change o braço
# MOP aborta com 0 steps nesse app enquanto ape/ape_pure/sata exploram normalmente.
#
# BIND-MOUNT DO tool.py: a imagem 0.9.2 é buildada a partir do branch `modules` do git
# e NÃO contém a compactação (verificado: grep -c _compact_static_analysis_json == 0).
# O install no container é editable (_editable_impl_aperv_tool.pth), então montar o
# arquivo por cima injeta a change sem rebuildar 19 GB. Isto é um desvio deliberado do
# padrão da campanha (imagem 0.9.2 é verificada SEM bind-mount) aceitável para uma
# validação pontual — uma campanha real exige a imagem rebuildada a partir do branch.
#
# Uso:
#   docker compose -f docker/docker-compose.gh80.yml up -d
#   docker logs -f gh80_00
#   # NAO dar 'down' antes de extrair traces (artefatos efemeros no device)
#
# Aceitação (task 3.2): trace contém `[APE-MOP-DATA] status=loaded` e > 0 `[APE-STEP]`.
# Aceitação (task 3.3): o JSON fonte segue com 50.615.217 bytes, byte-idêntico.

services:
  gh80_00:
    image: phtcosta/rvandroid:0.9.2
    container_name: gh80_00
    environment:
      RV_EXPERIMENT_NAME: gh80_00
      # Só o braço frontier: é o mais exigente em MOP data (usa transitions via
      # MopFrontierPass), logo o que melhor evidencia que o JSON foi aceito.
      RV_TOOLS: "aperv:sata_mop_act_frontier"
      RV_TIMEOUTS: "300"
      RV_REPETITIONS: "1"
      RV_NO_WINDOW: "true"
      RV_SPEC_SET: "jca"
      # APKs já instrumentados e static analysis já produzida (set do cmpma):
      # o JSON de 50.6 MB vem pareado ao APK e é copiado para o results_dir,
      # exercitando o caminho real de push que esta change altera.
      RV_SKIP_MONITORS: "true"
      RV_SKIP_INSTRUMENT: "true"
      RV_SKIP_STATIC_ANALYSIS: "true"
      RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/batch_00.txt"
      RV_DEVICE_PORT: "5554"
      RV_DELAY: "0"
    devices:
      - /dev/kvm:/dev/kvm
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "10g"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO_DATASET/APKS_INSTRUMENTED_jca_dexlib2_experimento-20260706_selected181:/opt/rvsec/rv-android/apks:ro
      - ../data/gh80_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/gh80_00:/opt/rvsec/rv-android/results
      # A change sob teste, injetada sobre o código da imagem (ver nota acima).
      - /pedro/desenvolvimento/workspaces/workspaces-doutorado/workspace-rv/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/tool.py:/opt/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/tool.py:ro
