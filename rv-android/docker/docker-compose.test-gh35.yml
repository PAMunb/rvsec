# gh35 bugfix validation: rvsmart:mvp (pure algorithm) on 16 worst-vs-APE apps.
# 8 containers, 2 APKs each, 600s timeout, 1 rep, JCA specs.
# No LLM/SGLang — pure algorithm mode.
#
# Usage:
#   docker compose -f docker/docker-compose.test-gh35.yml up -d
#   bash scripts/monitor_comparacao.sh data/results
#   docker compose -f docker/docker-compose.test-gh35.yml down

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-env
    RV_TOOLS: "rvsmart:mvp"
    RV_TIMEOUTS: "600"
    RV_REPETITIONS: "1"
    RV_NO_WINDOW: "true"
    RV_JCA_SPEC: "true"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "12g"

services:
  gh35_00:
    <<: *rvandroid-base
    container_name: gh35_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: gh35_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/gh35_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/gh35_00:/opt/rvsec/rv-android/results

  gh35_01:
    <<: *rvandroid-base
    container_name: gh35_01
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: gh35_01
