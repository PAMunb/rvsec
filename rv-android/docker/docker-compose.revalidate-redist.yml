      RV_DELAY: "16"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/reval_baseline_01_sub_d:/opt/rvsec/rv-android/results
      - /home/pedro/tmp/aperv-jars/ape-rv-baseline.jar:/opt/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:ro

  reval_baseline_01_sub_e:
    <<: *rvandroid-base
