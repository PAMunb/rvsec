      RV_DELAY: "50"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/cmp06:/opt/rvsec/rv-android/results

  cmp07:
    <<: *rvandroid-base
    container_name: cmp07
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: cmp07
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/batch_06.txt"
