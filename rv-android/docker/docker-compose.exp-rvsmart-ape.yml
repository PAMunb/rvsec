# Experiment: rvsmart:mvp (pure algorithm) + ape on 169 APKs.
# 10 containers, ~17 APKs each, 600s timeout, 3 reps, JCA specs.
# No LLM/SGLang — pure algorithm mode for rvsmart.
#
# Usage:
#   docker compose -f docker/docker-compose.exp-rvsmart-ape.yml up -d
#   bash scripts/monitor_comparacao.sh data/results
#   docker compose -f docker/docker-compose.exp-rvsmart-ape.yml down

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-env
    RV_TOOLS: "rvsmart:mvp,ape"
    RV_TIMEOUTS: "600"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_JCA_SPEC: "true"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

services:
  exp_00:
    <<: *rvandroid-base
    container_name: exp_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: exp_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/exp_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/exp_00:/opt/rvsec/rv-android/results

  exp_01:
    <<: *rvandroid-base
