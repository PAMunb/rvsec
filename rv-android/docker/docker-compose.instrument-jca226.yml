# Instrument-only compose: 226 reaches_mop APKs (gh51 GATOR validated subset).
# 10 containers x 22-23 APKs each, JCA specs, instrument-only (no static analysis,
# no experiment execution).
#
# --skip-execution is injected at runtime via entrypoint sed override: the baked
# entrypoint has no RV_SKIP_EXECUTION mapping (only --skip-monitors/--skip-instrument/
# --skip-static), so we sed the final `exec $CMD` line to append --skip-execution
# without touching docker/rvandroid/docker-entrypoint.sh in source. All other RV_*
# env mappings (--tools, --apks-dir, --specification-set, --skip-static, --apks-filter,
# --name, --no-window, --instrumentation-variant) flow through normally.
#
# Per-container resources: 4 cpus + 10g (no emulator runs). Total: 40 cpus + 100g
# (host: 64 cores / 125 GB — comfortable margin).
#
# Image is parameterized: override with RV_IMAGE env var if your local tag differs.
#   RV_IMAGE=phtcosta/rvandroid:0.9.0 docker compose -f docker/docker-compose.instrument-jca226.yml up -d
#
# Source APKs:    /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKs (400 originals)
# Filters:        data/instrument_jca226_filters/instrument_jca226_batch_NN.txt
# Per-container results:  data/results/instrument_jca226_NN/
# Instrumented APKs land at: data/results/instrument_jca226_NN/instrument_jca226_NN/instrumented_apks/*.apk
#
# Post-run flatten copy to APKS_JCA_soot:
#   bash scripts/copy_instrument_jca226_to_dataset.sh

x-rvandroid: &rvandroid-base
  image: ${RV_IMAGE:-phtcosta/rvandroid:0.8.0}
  entrypoint:
    - bash
    - -c
    - |
      sed 's#^exec $$CMD$$#exec $$CMD --skip-execution#' /opt/docker-entrypoint.sh > /tmp/entrypoint.sh
      chmod +x /tmp/entrypoint.sh
      exec /tmp/entrypoint.sh
  environment: &rvandroid-env
    RV_TOOLS: "monkey"
    RV_TIMEOUTS: "1"
    RV_REPETITIONS: "1"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_INSTRUMENTATION_VARIANT: "dexlib2"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

services:
  instrument_jca226_00:
    <<: *rvandroid-base
    container_name: instrument_jca226_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: instrument_jca226_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/instrument_jca226_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO/JOAO/APKs:/opt/rvsec/rv-android/apks:ro
      - ../data/instrument_jca226_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/instrument_jca226_00:/opt/rvsec/rv-android/results

  instrument_jca226_01:
