      - ../data/validacao_full/filters:/opt/rvsec/rv-android/filters:ro
      - ../data/validacao_full/results/validacao_full_dex_2:/opt/rvsec/rv-android/results

  validacao_full_dex_3:
    <<: *rvandroid-base
    container_name: validacao_full_dex_3
    environment:
