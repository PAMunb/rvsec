# FINAL 3: island1 × aperv:sata_mop × 3 reps — secondary evolved candidate (Area 1 mutations, orthogonal)
#
# 12 containers × 9GB RAM × 600s timeout × 3 reps × 169 APKs × aperv:sata_mop
# JAR: ape-rv-island1.jar
#
# Wall time estimate:
#   max 15 APKs/container × 1 tools × 3 reps × 640s = 28800s = 8.00h
#
# Launched automatically by /tmp/reval_orchestrator.sh

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-env
    RV_TOOLS: "aperv:sata_mop"
    RV_TIMEOUTS: "600"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "9g"

services:
  final_3_island1_00:
    <<: *rvandroid-base
    container_name: final_3_island1_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: final_3_island1_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/reval_final_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/final_3_island1_00:/opt/rvsec/rv-android/results
      - /home/pedro/tmp/aperv-jars/ape-rv-island1.jar:/opt/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:ro

  final_3_island1_01:
