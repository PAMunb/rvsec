# Paired-comparison template: ajc vs dexlib2 instrumentation variants on the
# same input set under identical conditions. Layer-4 of the validation
# framework (docs/20260423_plano_validacao.md) consumes the resulting paired
# data via BatchValidator (paired Wilcoxon TOST per spec, INV-INS-21).
#
# Both services use the SAME image tag (phtcosta/rvandroid:0.8.0). The image
# carries both variant modules (rv-instrumentation-ajc and
# rv-instrumentation-dexlib2 — gh53 consolidation); variant selection happens
# at runtime via RV_INSTRUMENTATION_VARIANT.
#
# This file is a TEMPLATE — copy it into a numbered exp file when Phase 5 is
# scheduled (e.g., docker-compose.exp7-dexlib2-validation.yml). The JCA-400
# batch breakdown (dexlib2val_batch_00.txt … _NN.txt) is generated per-run
# by scripts/setup_dexlib2_validation.sh.
#
# Pre-requisites:
#   1. mvn -pl rvsec-android/rvsec-instrumentation-dexlib2/cli -am package
#      from rvsec/ — produces the fat CLI jar at
#      rv-android/modules/rv-instrumentation-dexlib2/lib/instr-cli.jar via
#      design D9. The rvandroid Dockerfile gates the image build on this.
#   2. Image phtcosta/rvandroid:0.8.0 rebuilt (gh53 image carries both variants).
#   3. validator/oracles/layer4-thresholds.yaml committed (INV-INS-21
#      pre-registration).
#
# Usage (after the prereqs land):
#   cd rv-android
#   cp docker/docker-compose.dexlib2-validation.template.yml \
#      docker/docker-compose.exp7-dexlib2-validation.yml
#   # ...regenerate the batch files, expand ajc_NN/dexlib2_NN, then:
#   docker compose -f docker/docker-compose.exp7-dexlib2-validation.yml up -d

x-rvandroid-ajc: &rvandroid-ajc
  # AspectJ-based variant — runs the dex2jar+ajc+d8 pipeline.
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-ajc-env
    RV_TOOLS: "ape,aperv:sata,aperv:sata_mop"
    RV_TIMEOUTS: "600"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_JCA_SPEC: "true"
    RV_INSTRUMENTATION_VARIANT: "ajc"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

x-rvandroid-dexlib2: &rvandroid-dexlib2
  # DEX-native variant — runs the Java CLI (rvsec-instrumentation-dexlib2).
  # Same image tag as ajc; only the variant flag differs.
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-dexlib2-env
    RV_TOOLS: "ape,aperv:sata,aperv:sata_mop"
    RV_TIMEOUTS: "600"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_JCA_SPEC: "true"
    RV_INSTRUMENTATION_VARIANT: "dexlib2"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

# Replicate the aperv_NN service-per-batch convention from the existing
# aperv-comparacao composition. Layer-4 validation pairs each batch under
# both variants — same APKs, same seed, same timeouts.
services:
  # === ajc variant (5 containers × ~80 APKs × 3 reps = 1200 tasks) ===
  ajc_00:
    <<: *rvandroid-ajc
    container_name: rvsec_dexlib2val_ajc_00
    environment:
      <<: *rvandroid-ajc-env
      RV_EXPERIMENT_NAME: ajc_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/dexlib2val_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/dexlib2val_ajc_00:/opt/rvsec/rv-android/results

  # === dexlib2 variant (same 5 containers × same APK batches) ===
  dexlib2_00:
    <<: *rvandroid-dexlib2
    container_name: rvsec_dexlib2val_dexlib2_00
    environment:
      <<: *rvandroid-dexlib2-env
      RV_EXPERIMENT_NAME: dexlib2_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/dexlib2val_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/dexlib2val_dexlib2_00:/opt/rvsec/rv-android/results

