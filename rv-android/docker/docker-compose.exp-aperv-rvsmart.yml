# Experiment: aperv:sata_mop (new weights) + rvsmart:mvp on 169 APKs.
# 10 containers, ~17 APKs each, 600s timeout, 3 reps, JCA specs.
# Complements previous experiment (ape, aperv:sata, aperv:sata_mop old weights).
#
# Usage:
#   docker compose -f docker/docker-compose.exp-aperv-rvsmart.yml up -d
#   bash scripts/monitor_comparacao.sh data/results
#   docker compose -f docker/docker-compose.exp-aperv-rvsmart.yml down

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-env
    RV_TOOLS: "aperv:sata_mop,rvsmart:mvp"
    RV_TIMEOUTS: "600"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

services:
  exp2_00:
    <<: *rvandroid-base
    container_name: exp2_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: exp2_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/exp2_batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/exp2_00:/opt/rvsec/rv-android/results

  exp2_01:
    <<: *rvandroid-base
    container_name: exp2_01
    environment:
      <<: *rvandroid-env
