# Experiment 5 Smoke Test: 2 best prompts × 1 APK × 1 rep × 600s
# Validates: SGLang startup, model download, LLM routing, prompt variants
#
# Usage:
#   docker compose -f docker/docker-compose.exp5-smoke.yml up -d
#   docker compose -f docker/docker-compose.exp5-smoke.yml logs -f exp5_smoke
#   docker compose -f docker/docker-compose.exp5-smoke.yml down

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.8.0
  environment: &rvandroid-env
    RV_TOOLS: "aperv:sata_mop_llm_v13,aperv:sata_mop_llm_compact_v1"
    RV_TIMEOUTS: "60"
    RV_REPETITIONS: "1"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
    RVSMART_LLM_MODE: "true"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"
  depends_on:
    sglang:
      condition: service_healthy

services:
  sglang:
    image: lmsysorg/sglang:v0.5.6.post2
    container_name: sglang-server
    volumes:
      - ${HF_CACHE:-/pedro/desenvolvimento/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen3-VL-4B-Instruct
      --host 0.0.0.0
      --port 30000
      --trust-remote-code
      --attention-backend flashinfer
      --tool-call-parser qwen
      --enable-multimodal
      --context-length 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  exp5_smoke:
    <<: *rvandroid-base
    container_name: exp5_smoke
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: exp5_smoke
      RV_APKS_FILTER: "/opt/rvsec/rv-android/apks/exp5_smoke.txt"
      RV_DELAY: "0"
    volumes:
      - ${BASE_DIR:-../data}/apks:/opt/rvsec/rv-android/apks:ro
      - ${BASE_DIR:-../data}/results/exp5_smoke:/opt/rvsec/rv-android/results
      - ${APE_JAR:-/pedro/desenvolvimento/workspaces/workspaces-doutorado/workspace-rv/ape/target/ape-rv.jar}:/opt/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:ro
