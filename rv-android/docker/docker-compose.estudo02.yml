# Comparacao 'estudo02' — gerado por rv-experiment-compare.
# Tools: monkey,droidbot:dfs_greedy,droidbot:bfs_greedy,droidbot:dfs_naive,droidbot:bfs_naive,ape,droidmate,humanoid,ares,fastbot,qtesting
# 10 containers, timeouts [60, 180, 300]s, 3 reps, specs jca_android.
# ares/qtesting rodam como containers irmaos via /var/run/docker.sock:
#   o HOST precisa ter phtcosta/ares:latest e phtcosta/qtesting:latest.
# humanoid: sidecar rv-humanoid (phtcosta/humanoid:1.0), RV_HUMANOID_URL=rv-humanoid:50405.
# Plano: docs/20260908_estudo02.md
# Uso:
#   docker compose -f docker/docker-compose.estudo02.yml up -d
#   .claude/skills/rv-experiment-compare/scripts/monitor_compare.sh estudo02
#   # passada de resume final ao terminar: re-rodar o up -d (recupera FAILED transientes)
#   # NAO dar 'down' antes de extrair traces (artefatos efemeros no device)

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.9.3
  environment: &rvandroid-env
    # O monkey leva dois parametros pela DSL de tools (`@chave=valor`, INV-EXP-09).
    #
    # Sem eles o comando sai `monkey -v -v --ignore-security-exceptions`, e o monkey ABORTA com
    # exit 219 quando o app da crash ou ANR ("** Monkey aborted due to error / System appears to
    # have crashed at event 388 of 1000000000"). A task vira ERROR e a corrida sai truncada. Em
    # 09/09 isso reprovava 201 de 330 identidades do monkey (60,9%), contra menos de 1% em cada
    # um dos outros dez bracos; no artigo, com o `jca` de 23 specs, o monkey fechou 1961 de 1962.
    # Os 47 monitores do `jca_android` deixam o app mais lento e o ANR aparece sob a chuva de
    # eventos do monkey, que e' a ferramenta que injeta mais rapido.
    #
    # Os flags fazem o monkey seguir depois de crash/ANR, como as outras dez ferramentas ja fazem.
    # Nao cegam a medicao: RVSEC/RVSEC-COV seguem no logcat e crash/ANR seguem em app_events.csv.
    #
    # Por que a DSL e nao a variante `monkey:fast` (que ja traz os dois flags): a `fast` tambem
    # fixa `seed=12345`, e seed fixo faz as tres repeticoes injetarem a MESMA sequencia, colapsando
    # o desenho de 3 reps do artigo; e baixa a verbosidade para 1, invalidando o oraculo de traco
    # do smoke. A DSL sobrescreve so os dois flags sobre a variante `default`.
    #
    # Por que nao rebuild: o `parameters` do ToolConfig NAO entra na identidade do resume
    # (platform.py:317-325 usa apenas apk/name/variant/rep/timeout), entao a identidade nao muda,
    # as 129 identidades COMPLETED do monkey seguem puladas e as 204 em ERROR re-executam. Como o
    # `parameters` e' gravado por task no tasks.json, fica auditavel no proprio dado quais corridas
    # tiveram os flags. Efeito colateral esperado: o checksum da config muda e cada container loga
    # uma vez "Config changed since last run — resuming anyway"; a identidade e' independente dele.
    #
    # CUIDADO na sintaxe: tem de ser `=true` em todos. A forma de flag nua nao funciona, porque o
    # split de tools trata um identificador seguido de fim-de-token como NOVA ferramenta, e
    # `ignore_timeouts` iria para o registry como nome de ferramenta.
    RV_TOOLS: "monkey@ignore_crashes=true,ignore_timeouts=true,droidbot:dfs_greedy,droidbot:bfs_greedy,droidbot:dfs_naive,droidbot:bfs_naive,ape,droidmate,humanoid,ares,fastbot,qtesting"
    RV_TIMEOUTS: "60,180,300"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca_android"
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
    RV_HUMANOID_URL: "rv-humanoid:50405"
    RV_LOGCAT_DIAGNOSTICS: "true"
  devices:
    - /dev/kvm:/dev/kvm
  # O container cresce em memoria com as horas de uptime e bate no teto de 10 g: em 09/09, 7 dos 10
  # sairam com exit 137 (OOMKilled=true) entre 3 h e 13 h apos o launch. O 137 nao corrompe nada --
  # o resume por RV_EXPERIMENT_NAME pula as identidades COMPLETED e so a task em voo se perde --
  # mas container morto nao anda: os 7 ficaram parados de 1 h a 13 h porque nada os religou, e a
  # ocupacao caiu para 6,9 containers efetivos de 10 (51 h de container perdidas em 16 h de parede).
  # `on-failure` poe o proprio daemon do Docker para religar, sem depender de vigia externo. Nao usar
  # `unless-stopped`: no fim da campanha o rv-experiment sai 0 e o container seria religado em laco.
  restart: on-failure:20
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"
  depends_on:
    humanoid:
      condition: service_started

services:
  humanoid:
    image: phtcosta/humanoid:1.0
    container_name: rv-humanoid

  estudo02_00:
    <<: *rvandroid-base
    container_name: estudo02_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: estudo02_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/batch_00.txt"
      RV_DELAY: "0"
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_DATASET_FINAL/APKS_INSTRUMENTED_jca_android_dexlib2:/opt/rvsec/rv-android/apks:ro
      - ../data/estudo02_filters:/opt/rvsec/rv-android/filters:ro
      - ../data/results/estudo02_00:/opt/rvsec/rv-android/results
      - /var/run/docker.sock:/var/run/docker.sock

