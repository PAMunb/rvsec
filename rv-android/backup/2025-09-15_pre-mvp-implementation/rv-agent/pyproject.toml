[tool.poetry]
name = "rv-agent"
version = "0.1.0"
description = "RVAgent - Autonomous Android Testing Tool with LangChain"
authors = ["RVSec Team"]
readme = "README.md"
packages = [{include = "rv_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# Core RV modules
rv-android-core = {path = "../rv-android-core", develop = true}
rv-screen-parser = {path = "../rv-screen-parser", develop = true}
rv-tools = {path = "../rv-tools", develop = true}

# LangChain ecosystem (latest 2025 versions)
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-community = "^0.3.0" 

# LangChain provider integrations (latest 2025 versions)
langchain-ollama = {version = "^0.3.7", optional = true}
langchain-openai = {version = "^0.2.0", optional = true}
langchain-anthropic = {version = "^0.2.0", optional = true}
langchain-google-genai = {version = "^2.0.0", optional = true}

# Device interaction
uiautomator2 = "^3.0.0"

# HTTP client/server
requests = "^2.32.0"
flask = "^3.0.0"

# Configuration and validation
pydantic = "^2.9.0"

# Data processing
pillow = "^10.0.0"

# Claude API testing - using version with httpx fix
anthropic = {version = "^0.45.2", optional = true}
python-dotenv = "^1.0.0"
pandas = "^2.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.21.0"
black = "^24.0.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
bandit = "^1.7.0"

[tool.poetry.extras]
ollama = ["langchain-ollama"]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic", "anthropic"]
google = ["langchain-google-genai"]
claude = ["anthropic", "python-dotenv"]
all = [
    "langchain-ollama",
    "langchain-openai", 
    "langchain-anthropic",
    "langchain-google-genai",
    "anthropic"
]

[tool.poetry.scripts]
# CLI script for standalone execution
rvagent = "rv_agent.cli.main:main"

[tool.poetry.plugins."rv_tools.plugins"]
# Plugin registration for rv-experiment integration
rvagent = "rv_agent.integration.tool:RVAgentTool"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]