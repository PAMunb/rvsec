[tool.poetry]
name = "rvdroid-tool"
version = "0.1.0"
description = "RVdroid testing tool with uiautomator and LLM guidance"
authors = ["RV-Android Team"]
readme = "README.md"
packages = [{include = "rvdroid_tool", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
rv-android-core = {path = "../rv-android-core", develop = true}
rv-screen-parser = {path = "../rv-screen-parser", develop = true}
rv-llm = {path = "../rv-llm", develop = true}
rv-tools = {path = "../rv-tools", develop = true}
rv-uiautomator = {path = "../rv-uiautomator", develop = true}
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0" 
pytest-flask = "*"  # Para testes do servidor Flask
hypothesis = "^6.135.26"

# Plugin registration for rv-tools
[tool.poetry.plugins."rv_tools.plugins"]
rvdroid = "rvdroid_tool.tools.tool:RVDroidTool"

# Sem CLI próprio inicialmente - apenas uso programático via plugin

[tool.pytest.ini_options]
addopts = "--cov=src"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
# show_missing = true
# fail_under = 80

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"