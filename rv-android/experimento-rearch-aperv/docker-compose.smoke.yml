# Smoke da perna B — o criterio de aceitacao da campanha (gh97 tasks 7.1-7.4).
#
# NAO e uma campanha reduzida, e um teste de deploy. Ele existe para responder
# quatro perguntas antes de 24 h de relogio serem gastas: o jar certo venceu o
# bind-mount, o jar honra `ape.preset`, o parametro `corpus_basis` sobreviveu ao
# DSL, e o artefato MOP compacto carrega no device. Nenhum desfecho e lido daqui
# — desfecho e a campanha, sob o plano congelado.
#
# Um unico container roda os TRES bracos sobre 2 aplicacoes, 1 repeticao, 300 s:
# 6 runs, ~45 min de relogio. O pre-flight so precisa de um trace por braco, mas
# duas aplicacoes dao redundancia contra uma falha transiente de `adb install`,
# que reprovaria o smoke sem dizer nada sobre o deploy.
#
# 300 s e defensavel porque as duas aplicacoes foram escolhidas pelo cov_mop que
# a perna A mediu nelas: o boost aparece cedo em ambas. Se o smoke voltar sem
# boost, a leitura correta e "o deploy falhou", nao "faltou tempo" — mas essa
# leitura so vale por causa do criterio de escolha, e por isso ele esta escrito
# abaixo em vez de ficar implicito.
#
# AS DUAS APLICACOES FORAM ESCOLHIDAS PELOS RESULTADOS DA PERNA A, nao pela
# analise estatica — o que a perna A mediu e a melhor evidencia disponivel de que
# a guia MOP de fato dispara nelas:
#
#   com.hegocre.nextcloudpasswords_38  cov_mop 17,8 nos bracos guiados contra
#                                      4,0 no controle. E o maior contraste
#                                      guiado-vs-controle do corpus, entao e onde
#                                      "o boost disparou" (task 7.2a) fica mais
#                                      visivel.
#   com.cointrend_10304                cov_mop ~68 nos tres bracos, cov_act 100,
#                                      aplicacao pequena. Redundancia barata.
#
# Ambas com 0 crashes na perna A e ambas dentro do subset40, de modo que o
# `corpus_basis` declarado continua verdadeiro: ele nomeia a lista de onde as
# aplicacoes saem, nao quantas rodaram.
#
# O TIMEOUT REDUZIDO E O QUE TORNA DUAS CLAUSULAS DA 7.2b OPCIONAIS: um erro de
# LLM e um `no_match reason=dead_pair` nao podem ser forcados em 600 s, e por
# isso sao registrados se aparecerem e nunca exigidos. Ambos ja estao afirmados
# em nivel de schema pelos testes de golden fixture do gh94.
#
# Os resultados vao para ./results_smoke/, e nao para ./results/: a identidade de
# um run inclui o timeout, entao um smoke de 600 s nunca colidiria com a campanha
# de 1800 s, mas ele apareceria na mesma arvore que `verify.py` e
# `consolidate.py` varrem, e a contagem de 360 deixaria de significar o que diz.
#
# Uso:
#   docker compose -f docker-compose.smoke.yml up -d
#   uv run python scripts/preflight_runstart.py --results results_smoke --manifest manifest.json
#   # a campanha so comeca com 3/3 bracos PASS nas quatro checagens
#   # NAO dar 'down' antes de extrair os traces — artefatos sao efemeros no device

services:
  # O nome do SERVICO precisa ser `sglang`: a ponte socat do entrypoint aponta
  # para o hostname `sglang` (docker/rvandroid/docker-entrypoint.sh:40). O
  # container_name difere so para nao colidir com o da campanha.
  sglang:
    image: lmsysorg/sglang:v0.5.6.post2
    container_name: sglang-server-smoke
    volumes:
      - ${HF_CACHE:-/pedro/desenvolvimento/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    shm_size: "16g"
    # GPU como dispositivo CDI, e nao por driver: o runtime nvidia nao esta
    # registrado no daemon deste host. Ver README, secao "Ambiente".
    devices:
      - nvidia.com/gpu=0
    # Modelo stock, o mesmo da perna A e o mesmo da campanha.
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen3-VL-4B-Instruct
      --host 0.0.0.0
      --port 30000
      --trust-remote-code
      --attention-backend flashinfer
      --tool-call-parser qwen
      --enable-multimodal
      --context-length 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  rearch_aperv_smoke:
    image: phtcosta/rvandroid:0.9.3-rearch
    container_name: rearch_aperv_smoke
    environment:
      # Os tres bracos e o parametro de corpus sao byte-identicos aos da
      # campanha. E o ponto: o pre-flight verifica a cadeia
      # RV_TOOLS -> _parse_single_tool_spec -> configure() -> ape.properties ->
      # RUN_START sobre exatamente a configuracao que a campanha vai rodar, e um
      # `corpus_basis` ausente aqui significa que o DSL perdeu o valor.
      RV_TOOLS: "aperv:mop_on_llm_off:mop_off_llm_off:mop_on_llm_70@corpus_basis=subset40:b60903adf4c8fca07e014e3655db158a220184d112f2f995a181fd98dd3d48d4"
      RV_TIMEOUTS: "300"
      RV_REPETITIONS: "1"
      RV_NO_WINDOW: "true"
      RV_SPEC_SET: "jca"
      RV_SKIP_MONITORS: "true"
      RV_SKIP_INSTRUMENT: "true"
      RV_SKIP_STATIC_ANALYSIS: "true"
      RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
      RV_DEVICE_PORT: "5554"
      RVSMART_LLM_MODE: "true"
      RV_LOGCAT_DIAGNOSTICS: "true"
      RV_EXPERIMENT_NAME: rearch_aperv_smoke
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/smoke.txt"
      RV_DELAY: "0"
    devices:
      - /dev/kvm:/dev/kvm
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "10g"
    depends_on:
      sglang:
        condition: service_healthy
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO_DATASET/APKS_INSTRUMENTED_jca_dexlib2_experimento-20260706_selected181:/opt/rvsec/rv-android/apks:ro
      - ./filters:/opt/rvsec/rv-android/filters:ro
      # O jar sob teste, :ro por cima do que a propria imagem construiu do
      # master do ape. Se este mount nao vencer, o container roda o jar legado,
      # que nao emite RUN_START — e o pre-flight falha na primeira leitura.
      - ../modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:/opt/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:ro
      - ./results_smoke/rearch_aperv_smoke:/opt/rvsec/rv-android/results
