# Portao empirico da re-arquitetura do APE-RV — gh97-rearch-ab-gate.
#
# Perna B da comparacao A/B. A perna A e a corrida decisiva E3, ja executada e
# congelada em ../experimento-e3-decisiva/per_apk_paired.csv. O plano de analise
# esta pre-registrado em ../docs/20260804_preregistro_gate_rearch.md. Depois do
# congelamento ele so admite emenda registrada (sha256 novo ao lado do original,
# em ../calibracao/journal.jsonl), nunca edicao silenciosa.
#
# A GRADE e IDENTICA a da perna A por exigencia, nao por preferencia: mesmos tres
# bracos, mesmos 40 APKs, 3 repeticoes, 1800 s, 360 runs. O valor por aplicacao da
# perna A e media de tres replicas, entao uma perna B com menos replicas tornaria
# a diferenca pareada assimetricamente mais ruidosa — que e o modo de falha do
# 2026-06-19 que este portao existe para evitar. Nada disso foi tocado.
#
#   mop_on_llm_off   referencia — sata + substrato frontier, guia MOP ligada
#   mop_off_llm_off  controle   — identico, pesos MOP zerados. E o canal que
#                                 isola a reescrita: com os cinco pesos em 0 e o
#                                 gatilho de atividade desligado, a mudanca de
#                                 substrato do gh96 nao alcanca o comportamento
#   mop_on_llm_70    LLM        — identico a referencia + dose 0,7
#
# TRES COISAS DIFEREM DA PERNA A. As duas primeiras sao o ponto do portao; a
# terceira e um custo assumido e registrado.
#
#   1. A imagem e uma tag NOVA, 0.9.3-rearch. Reconstruir 0.9.3 no lugar tornaria
#      as duas pernas indistinguiveis por tag e reproduziria a forma do gh71 na
#      camada de imagem.
#   2. O jar sob teste chega por bind-mount. O Dockerfile clona phtcosta/ape sem
#      --branch e sem pin de SHA, e no momento da campanha `rearch` ainda nao
#      esta em merge, entao existem DOIS jars no container e RUN_START.build e o
#      unico discriminador. O pre-flight (scripts/preflight_runstart.py) checa
#      exatamente isso antes de a campanha comecar.
#   3. A PARTICAO (emenda 01, 2026-08-05): 10 x 4 em filters10/, contra 8 x 5 na
#      perna A, pela mesma regra alfabetica deterministica. Motivo: orcamento de
#      relogio — ~18,6 h contra ~23,2 h, com o ciclo por run medido no smoke em
#      ~1857 s. Custo, dito sem atenuacao: os filtros deixam de ser byte-identicos
#      aos da perna A, entao uma aplicacao nao roda mais no mesmo container-indice
#      das duas vezes e efeito-de-container para de cancelar na diferenca pareada.
#      O pareamento POR APLICACAO, que e o que sustenta G1/G2/G3, fica intacto.
#      Os oito arquivos da perna A seguem em filters/, como evidencia dela.
#
# O corpus viaja como parametro do DSL de ferramentas: @corpus_basis=<id>:<sha256>
# do ../calibracao/subset40.txt. O valor e ecoado em RUN_START e lido por nada;
# ele existe para que um run responda de que lista foi tirado a partir dos seus
# proprios artefatos.
#
# Uso:
#   docker compose up -d
#   bash scripts/monitor.sh
#   # resume: re-rodar o mesmo 'up -d' (recupera tasks FAILED transientes)
#   # NAO dar 'down' antes de extrair os traces — artefatos sao efemeros no device

x-rvandroid: &rvandroid-base
  image: phtcosta/rvandroid:0.9.3-rearch
  environment: &rvandroid-env
    RV_TOOLS: "aperv:mop_on_llm_off:mop_off_llm_off:mop_on_llm_70@corpus_basis=subset40:b60903adf4c8fca07e014e3655db158a220184d112f2f995a181fd98dd3d48d4"
    RV_TIMEOUTS: "1800"
    RV_REPETITIONS: "3"
    RV_NO_WINDOW: "true"
    RV_SPEC_SET: "jca"
    # Os APKs montados sao os MESMOS binarios instrumentados da perna A
    # (jca/dexlib2, campanha 20260706). Reinstrumentar produziria binarios
    # diferentes dos que a analise estatica descreve e quebraria tanto o join
    # com os .apk.json quanto o pareamento com a perna A.
    RV_SKIP_MONITORS: "true"
    RV_SKIP_INSTRUMENT: "true"
    RV_SKIP_STATIC_ANALYSIS: "true"
    RV_APKS_DIR: "/opt/rvsec/rv-android/apks"
    RV_DEVICE_PORT: "5554"
    # Liga a ponte socat 127.0.0.1:30000 -> container sglang
    # (docker/rvandroid/docker-entrypoint.sh:38-40). O jar le llm_url de dentro
    # do emulador, onde 10.0.2.2 e o alias de host-loopback do QEMU.
    RVSMART_LLM_MODE: "true"
    RV_LOGCAT_DIAGNOSTICS: "true"
  devices:
    - /dev/kvm:/dev/kvm
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: "10g"

# Os volumes sao repetidos por servico e nao ancorados: o compose funde
# mapeamentos, nunca listas, entao um alias de lista viraria lista aninhada e o
# arquivo nem carregaria. Os tres primeiros sao identicos aos da perna A; o
# quarto e o jar sob teste, montado :ro por cima do jar que a propria imagem
# construiu (precedente: docker/docker-compose.cmpft2.yml:46).

# ESTE ARQUIVO NAO SOBE UM SGLANG. Ele se liga ao que ja esta de pe, pelo mesmo
# motivo medido no smoke: a GPU tem 15,47 GiB e o servidor da PERNA A ocupa 12,6
# GiB, entao uma segunda instancia morre em CUDA out of memory antes de servir.
# Reusar tambem REMOVE uma diferenca entre as pernas — o braco LLM da perna B
# passa a ser servido pelo mesmo backend que serviu a perna A.
# A rede `experimento-e3-decisiva_default` ja carrega o alias `sglang`, que e o
# hostname para onde a ponte socat do entrypoint aponta.

networks:
  sglang_net:
    external: true
    name: experimento-e3-decisiva_default

services:

  # Cada container roda os TRES bracos sobre os SEUS 5 APKs, e a particao e
  # byte-identica a da perna A: batch_NN.txt aqui e o mesmo arquivo que la. O
  # pareamento e por aplicacao, entao manter os tres bracos de um APK no mesmo
  # container faz uma falha de container derrubar o par inteiro em vez de meio
  # par — o que o resume recupera limpo, enquanto meio par exigiria descarte.
  #
  # RV_DELAY escalona a subida dos emuladores de 10 em 10 s: oito emuladores
  # bootando ao mesmo tempo disputam CPU e alguns estouram o timeout de boot.
  rearch_aperv_00:
    <<: *rvandroid-base
    container_name: rearch_aperv_00
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: rearch_aperv_00
      RV_APKS_FILTER: "/opt/rvsec/rv-android/filters/batch_00.txt"
      RV_DELAY: "0"
    networks:
      - sglang_net
    volumes:
      - /home/pedro/desenvolvimento/RV_ANDROID_NOVO_DATASET/APKS_INSTRUMENTED_jca_dexlib2_experimento-20260706_selected181:/opt/rvsec/rv-android/apks:ro
      - ./filters10:/opt/rvsec/rv-android/filters:ro
      - ../modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:/opt/rvsec/rv-android/modules/aperv-tool/src/aperv_tool/tools/aperv/ape-rv.jar:ro
      - ./results/rearch_aperv_00:/opt/rvsec/rv-android/results

  rearch_aperv_01:
    <<: *rvandroid-base
    container_name: rearch_aperv_01
    environment:
      <<: *rvandroid-env
      RV_EXPERIMENT_NAME: rearch_aperv_01
