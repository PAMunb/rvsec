[tool.poetry]
name = "rv-android"
version = "0.1.0"
description = "RV-Android Modular Platform Workspace"
authors = ["RV-Android Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# Dependências comuns do workspace
requests = "^2.32.0"
pyyaml = "^6.0"

# Path dependencies
rv-android-core = {path = "modules/rv-android-core", develop = true}
rv-monitor-generator = {path = "modules/rv-monitor-generator", develop = true}
rv-instrumentation = {path = "modules/rv-instrumentation", develop = true}
rv-static-analysis = {path = "modules/rv-static-analysis", develop = true}
rv-screen-parser = {path = "modules/rv-screen-parser", develop = true}
rv-coverage = {path = "modules/rv-coverage", develop = true}
rv-llm = {path = "modules/rv-llm", develop = true}
rv-tools = {path = "modules/rv-tools", develop = true}
rv-platform = {path = "modules/rv-platform", develop = true}
rvandroid-tool = {path = "modules/rvandroid-tool", develop = true}
rv-experiment = {path = "modules/rv-experiment", develop = true}
#rvandroid = {path = "modules/rvandroid", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.0.0"
flake8 = "^7.0.0"
pylint = "^3.2.0"
mypy = "^1.11.0"
bandit = "^1.7.0"
vulture = "^2.7.0"
safety = "^3.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"