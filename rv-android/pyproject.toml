[tool.poetry]
name = "rv-android"
version = "0.1.0"
description = "RV-Android Modular Platform Workspace"
authors = ["RV-Android Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# Dependências comuns
requests = "^2.28.0"
pyyaml = "^6.0"
# Dependências do rv-android-core
psutil = "^7.0.0"
networkx = "^3.5"
androguard = "3.4.0a1"

# Path dependencies
rv-android-core = {path = "modules/rv-android-core", develop = true}
rv-monitor-generator = {path = "modules/rv-monitor-generator", develop = true}
rv-static-analysis = {path = "modules/rv-static-analysis", develop = true}
rv-screen-parser = {path = "modules/rv-screen-parser", develop = true}
rv-coverage = {path = "modules/rv-coverage", develop = true}

# Excluded from CI testing
# rv-instrumentation = {path = "modules/rv-instrumentation", develop = true}
# rvandroid = {path = "modules/rvandroid", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^23.0"
flake8 = "^6.0"
pylint = "^3.0"
mypy = "^1.0"
bandit = "^1.7"
vulture = "^2.7"
safety = "^3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"