name: Enhancement
description: Improve an existing capability in RV-Android
title: "[Enhancement] "
labels: ["type:enhancement", "track:ff-sdd"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        Describe the improvement. Explain what exists today and how it should be better.
        This becomes the input for `/opsx:explore`.
      placeholder: "The current implementation of X works but could be improved by..."
    validations:
      required: true

  - type: checkboxes
    id: domains
    attributes:
      label: Affected Domains
      description: Which specification domains does this enhancement touch?
      options:
        - label: Core (rv-android-core)
        - label: Platform (rv-platform)
        - label: Experiment (rv-experiment)
        - label: Agent (rv-agent, rv-llm)
        - label: Instrumentation (rv-monitor-generator, rv-instrumentation)
        - label: Analysis (rv-static-analysis, rv-coverage, rv-screen-parser)
        - label: Tools (rv-tools, rv-uiautomator)

  - type: input
    id: related-frs
    attributes:
      label: Related FRs/NFRs
      description: Reference requirements from PRD.md (e.g., FR21, NFR03).
      placeholder: "FR21, NFR03"

  - type: dropdown
    id: track
    attributes:
      label: SDD Track
      description: Select the appropriate workflow track (see docs/WORKFLOW.md).
      options:
        - Full SDD
        - Fast-Forward SDD
        - Quick Path
      default: 1
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
      default: 1
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define when this enhancement is considered complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
