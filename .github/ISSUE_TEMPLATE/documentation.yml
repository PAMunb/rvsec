name: Documentation
description: Documentation update or addition
title: "[Docs] "
labels: ["type:docs", "track:quick-path"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        Describe the documentation change needed. Reference specific files,
        sections, or topics that need to be created or updated.
      placeholder: "The documentation for module X is missing information about..."
    validations:
      required: true

  - type: checkboxes
    id: domains
    attributes:
      label: Affected Domains
      description: Which specification domains does this documentation touch?
      options:
        - label: Core (rv-android-core)
        - label: Platform (rv-platform)
        - label: Experiment (rv-experiment)
        - label: Agent (rv-agent, rv-llm)
        - label: Instrumentation (rv-monitor-generator, rv-instrumentation)
        - label: Analysis (rv-static-analysis, rv-coverage, rv-screen-parser)
        - label: Tools (rv-tools, rv-uiautomator)

  - type: input
    id: related-frs
    attributes:
      label: Related FRs/NFRs
      description: Reference requirements from PRD.md if applicable.
      placeholder: "FR01, NFR07"

  - type: dropdown
    id: track
    attributes:
      label: SDD Track
      description: Select the appropriate workflow track (see docs/WORKFLOW.md).
      options:
        - Full SDD
        - Fast-Forward SDD
        - Quick Path
      default: 2
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
      default: 1
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define when this documentation task is considered complete.
      placeholder: |
        - [ ] Documentation added/updated
        - [ ] Cross-references verified
