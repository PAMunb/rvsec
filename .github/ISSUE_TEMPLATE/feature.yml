name: Feature Request
description: Propose a new capability for RV-Android
title: "[Feature] "
labels: ["type:feature", "track:full-sdd"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: >
        Describe the problem this feature solves. This becomes the input for `/opsx:explore`.
        Explain the current limitation and why a new capability is needed.
      placeholder: "Currently, RV-Android cannot..."
    validations:
      required: true

  - type: checkboxes
    id: domains
    attributes:
      label: Affected Domains
      description: Which specification domains does this feature touch?
      options:
        - label: Core (rv-android-core)
        - label: Platform (rv-platform)
        - label: Experiment (rv-experiment)
        - label: Agent (rv-agent, rv-llm)
        - label: Instrumentation (rv-monitor-generator, rv-instrumentation)
        - label: Analysis (rv-static-analysis, rv-coverage, rv-screen-parser)
        - label: Tools (rv-tools, rv-uiautomator)

  - type: input
    id: related-frs
    attributes:
      label: Related FRs/NFRs
      description: Reference functional or non-functional requirements from PRD.md (e.g., FR21, NFR03).
      placeholder: "FR21, FR25, NFR03"

  - type: dropdown
    id: track
    attributes:
      label: SDD Track
      description: Select the appropriate workflow track (see docs/WORKFLOW.md).
      options:
        - Full SDD
        - Fast-Forward SDD
        - Quick Path
      default: 0
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
      default: 1
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define when this feature is considered complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
