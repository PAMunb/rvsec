name: CI Pipeline
on:
  push:
    branches:
      - develop
      - modules
  pull_request:
    branches:
      - develop
      - modules

jobs:
  maven-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove backup directories
        run: rm -rf rv-android/backup/ rv-android/docs/backup/ rv-android/modules/rv-agent/backup/ rv-android/modules/rv-agent-validation/backup/

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Maven project (excluding rvsmart)
        run: mvn clean install -DskipTests -DskipMopAgent -pl '!rvsec/rvsec-android/rvsmart'

  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove backup directories
        run: rm -rf rv-android/backup/ rv-android/docs/backup/ rv-android/modules/rv-agent/backup/ rv-android/modules/rv-agent-validation/backup/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: rv-android/uv.lock

      - name: Set RVSEC environment
        run: echo "RVSEC_HOME=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: uv sync
        working-directory: rv-android

      - name: Run tests
        run: uv run pytest modules/ -m "not slow" --import-mode=importlib --tb=short -q
        working-directory: rv-android
