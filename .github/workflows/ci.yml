name: CI Pipeline
# NOTE: Currently running with reduced scope (3 modules) to resolve disk space issues
# Full pipeline will be restored after implementing parallel jobs strategy
'on':
  push:
    branches:
      - develop
      - modules
  pull_request:
    branches:
      - develop
      - modules
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y tesseract-ocr libtesseract-dev libopencv-dev python3-opencv
      
      - name: Build Maven project
        run: mvn clean install -DskipTests -DskipMopAgent
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            rv-android/modules/*/.venv
          key: poetry-modules-${{ runner.os }}-${{ hashFiles('rv-android/modules/*/poetry.lock') }}
          restore-keys: |
            poetry-modules-${{ runner.os }}-
      
      - name: Install Poetry dependencies
        run: |
          # Skip workspace install to avoid duplication - install modules directly
          cd modules && ./install.sh
          # Clean Python cache files immediately after install
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
        working-directory: rv-android
      
      - name: Set RVSEC environment
        run: echo "RVSEC_HOME=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Run code quality checks (informational)
        continue-on-error: true
        run: |
          # Run checks only on core modules to minimize disk usage
          cd modules/rv-android-core
          echo "Running essential Flake8 checks on core..."
          poetry run flake8 src/ --count --select=E9,F63,F7,F82 --statistics --quiet > ../../flake8_report.txt || true
          
          echo "Running security checks with Bandit on core..."
          poetry run bandit -r src/ --format txt --quiet --exit-zero > ../../bandit_report.txt || true
        working-directory: rv-android
      
      - name: Create coverage config
        run: |
          echo "[run]" > .coveragerc
          echo "source = modules/" >> .coveragerc
        working-directory: rv-android
      
      - name: Run Python tests with coverage
        run: |
          # TEMPORARY: Testing only critical modules to resolve disk space issues
          # Full module list: rv-android-core rv-monitor-generator rv-static-analysis rv-coverage rv-screen-parser rv-llm rv-tools rvandroid-tool rv-experiment
          # Currently testing: rv-android-core rv-llm rvandroid-tool
          cd modules && ./test.sh --coverage --continue-on-error rv-android-core rv-llm rvandroid-tool --quiet
          # Clean up test artifacts to save space
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
        working-directory: rv-android
      
      - name: Run integration tests (with RVSEC)
        continue-on-error: true
        run: |
          # Verify RVSEC tools are available
          ls -la $RVSEC_HOME/javamop/bin/ >/dev/null 2>&1 || echo "JavaMOP not found"
          ls -la $RVSEC_HOME/rv-monitor/bin/ >/dev/null 2>&1 || echo "RV-Monitor not found"
          
          # TEMPORARY: Testing only core module for integration tests (disk space optimization)
          # Full integration test modules: rv-android-core rv-monitor-generator
          # Currently testing: rv-android-core only
          cd modules/rv-android-core && poetry run pytest -m "slow" --tb=short --quiet || true
        working-directory: rv-android
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            rv-android/modules/*/coverage.xml
            rv-android/modules/*/htmlcov/

      - name: Generate quality report
        if: always()
        run: |
          echo "# Python Quality Report" > quality_report.md
          echo "## Test Coverage Summary" >> quality_report.md
          echo '```' >> quality_report.md
          find modules -name "coverage.xml" -exec grep -A 1 "<summary" {} \; 2>/dev/null | head -10 >> quality_report.md || echo "No coverage summary available" >> quality_report.md
          echo '```' >> quality_report.md
          
          echo "## Code Quality Issues" >> quality_report.md
          echo '```' >> quality_report.md
          head -10 flake8_report.txt >> quality_report.md 2>/dev/null || echo "No code issues found" >> quality_report.md
          head -10 bandit_report.txt >> quality_report.md 2>/dev/null || echo "No security issues found" >> quality_report.md
          echo '```' >> quality_report.md
        working-directory: rv-android
        continue-on-error: true
      
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: rv-android/quality_report.md
