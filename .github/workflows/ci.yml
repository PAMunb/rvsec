name: CI Pipeline
'on':
  push:
    branches:
      - develop
      - modules
  pull_request:
    branches:
      - develop
      - modules
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y tesseract-ocr libtesseract-dev libopencv-dev python3-opencv
      
      - name: Build Maven project
        run: mvn clean install -DskipTests -DskipMopAgent
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: rv-android/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('rv-android/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      
      - name: Install Poetry dependencies
        run: |
          # Install workspace dependencies
          poetry install
          # Install additional system-specific dependencies
          poetry run pip install uiautomator2 pytesseract opencv-python Pillow numpy
          # Install module dependencies using the workspace installer
          cd modules && ./install.sh
        working-directory: rv-android
      
      - name: Set RVSEC environment
        run: echo "RVSEC_HOME=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Run code quality checks (informational)
        continue-on-error: true
        run: |
          # Limit output to reduce disk usage
          echo "Running essential Flake8 checks..."
          poetry run flake8 modules/rv-android-core modules/rv-llm modules/rvandroid-tool --count --select=E9,F63,F7,F82 --statistics --quiet
          
          echo "Running security checks with Bandit..."
          poetry run bandit -r modules/rv-android-core modules/rv-llm modules/rvandroid-tool --format txt --quiet --exit-zero > bandit_report.txt || true
          
          echo "Running Vulture to detect unused code..."
          poetry run vulture modules/rv-android-core modules/rv-llm modules/rvandroid-tool --min-confidence 80 > vulture_report.txt || true            
        working-directory: rv-android
      
      - name: Create coverage config
        run: |
          echo "[run]" > .coveragerc
          echo "source = modules/" >> .coveragerc
        working-directory: rv-android
      
      - name: Run Python tests with coverage
        run: |
          # Run tests using the module test runner for all modules - limit output
          cd modules && ./test.sh --coverage --continue-on-error rv-android-core rv-monitor-generator rv-static-analysis rv-coverage rv-screen-parser rv-llm rv-tools rvandroid-tool rv-experiment --quiet
        working-directory: rv-android
      
      - name: Run integration tests (with RVSEC)
        continue-on-error: true
        run: |
          # Verify RVSEC tools are available
          ls -la $RVSEC_HOME/javamop/bin/ >/dev/null 2>&1 || echo "JavaMOP not found"
          ls -la $RVSEC_HOME/rv-monitor/bin/ >/dev/null 2>&1 || echo "RV-Monitor not found"
          
          # Run integration tests for key modules with limited output
          cd modules
          for module in rv-android-core rv-monitor-generator; do
            if [ -d "$module" ]; then
              echo "Running integration tests for $module"
              cd "$module" && poetry run pytest -m "slow" --tb=short --quiet || true
              cd ..
            fi
          done
        working-directory: rv-android
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            rv-android/modules/*/coverage.xml
            rv-android/modules/*/htmlcov/

      - name: Generate quality report
        if: always()
        run: |
          echo "# Python Quality Report" > quality_report.md
          echo "## Test Coverage Summary" >> quality_report.md
          echo '```' >> quality_report.md
          find modules -name "coverage.xml" -exec grep -A 2 "<summary" {} \; >> quality_report.md 2>/dev/null || echo "No coverage summary available" >> quality_report.md
          echo '```' >> quality_report.md
          
          echo "## Security Issues (if any)" >> quality_report.md
          echo '```' >> quality_report.md
          head -20 bandit_report.txt >> quality_report.md 2>/dev/null || echo "No security issues found" >> quality_report.md
          echo '```' >> quality_report.md

          echo "## Unused Code (top 10)" >> quality_report.md
          echo '```' >> quality_report.md
          head -10 vulture_report.txt >> quality_report.md 2>/dev/null || echo "No unused code detected" >> quality_report.md
          echo '```' >> quality_report.md
        working-directory: rv-android
        continue-on-error: true
      
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: rv-android/quality_report.md
