name: CI Pipeline
'on':
  push:
    branches:
      - develop
      - modules
  pull_request:
    branches:
      - develop
      - modules
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y tesseract-ocr libtesseract-dev libopencv-dev python3-opencv
      
      - name: Build Maven project
        run: mvn clean install -DskipTests -DskipMopAgent
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            rv-android/.venv
            rv-android/modules/*/.*venv
          key: poetry-${{ runner.os }}-${{ hashFiles('rv-android/poetry.lock', 'rv-android/modules/*/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      
      - name: Install Poetry dependencies
        run: |
          # Install workspace dependencies
          poetry install
          # Install additional system-specific dependencies
          poetry run pip install uiautomator2 pytesseract opencv-python Pillow numpy
          # Install module dependencies using the workspace installer
          cd modules && ./install.sh
        working-directory: rv-android
      
      - name: Set RVSEC environment
        run: echo "RVSEC_HOME=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Run code quality checks (informational)
        continue-on-error: true
        run: |
          echo "Running Flake8 checks..."
          poetry run flake8 modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment --count --select=E9,F63,F7,F82 --show-source --statistics
          
          echo "Running more comprehensive Flake8 checks (warnings only)..."
          poetry run flake8 modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
          echo "Running Pylint checks (warnings only)..."
          poetry run pylint --exit-zero --disable=all --enable=E,F,W,R $(find modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment -type f -name "*.py" 2>/dev/null || true)
          
          echo "Running type checking with MyPy (warnings only)..."
          poetry run mypy modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs --check-untyped-defs --disallow-untyped-calls --warn-redundant-casts --warn-return-any --warn-unused-ignores --no-strict-optional --no-error-summary || true
          
          echo "Running security checks with Bandit (warnings only)..."
          poetry run bandit -r modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment --format txt --quiet --exit-zero || true
          
          echo "Checking code formatting with Black (warnings only)..."
          poetry run black --check --diff modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment || true

          echo "Running Vulture to detect unused code..."
          poetry run vulture modules/rv-android-core modules/rv-monitor-generator modules/rv-instrumentation modules/rv-static-analysis modules/rv-coverage modules/rv-screen-parser modules/rv-llm modules/rv-tools modules/rvandroid-tool modules/rv-experiment --min-confidence 80 > vulture_report.txt || true            
        working-directory: rv-android
      
      - name: Create coverage config
        run: |
          echo "[run]" > .coveragerc
          echo "source = modules/" >> .coveragerc
        working-directory: rv-android
      
      - name: Run Python tests with coverage
        run: |
          # Run tests using the module test runner
          cd modules && ./test.sh --coverage --continue-on-error rv-android-core rv-monitor-generator rv-static-analysis rv-llm
        working-directory: rv-android
      
      - name: Run integration tests (with RVSEC)
        continue-on-error: true
        run: |
          # Verify RVSEC tools are available
          ls -la $RVSEC_HOME/javamop/bin/ || echo "JavaMOP not found - integration tests may fail"
          ls -la $RVSEC_HOME/rv-monitor/bin/ || echo "RV-Monitor not found - integration tests may fail"
          
          # Run integration tests using individual module test runners
          cd modules
          for module in rv-android-core rv-monitor-generator; do
            if [ -d "$module" ]; then
              echo "Running integration tests for $module"
              cd "$module" && poetry run pytest -m "slow" --tb=short -v || true
              cd ..
            fi
          done
        working-directory: rv-android
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            rv-android/modules/*/coverage.xml
            rv-android/modules/*/htmlcov/

      - name: Generate quality report
        if: always()
        run: |
          echo "# Python Quality Report" > quality_report.md
          echo "## Test Coverage Summary" >> quality_report.md
          echo '```' >> quality_report.md
          find modules -name "coverage.xml" -exec grep -A 5 "<summary" {} \; >> quality_report.md 2>/dev/null || echo "No coverage summary available" >> quality_report.md
          echo '```' >> quality_report.md
          
          echo "## Code Quality Issues" >> quality_report.md
          echo "### Flake8 Issues (if any)" >> quality_report.md
          echo '```' >> quality_report.md
          poetry run flake8 modules/rv-android-core modules/rv-monitor-generator modules/rv-static-analysis modules/rv-llm --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics >> quality_report.md || echo "Flake8 analysis failed" >> quality_report.md
          echo '```' >> quality_report.md
          
          echo "### Security Issues (if any)" >> quality_report.md
          echo '```' >> quality_report.md
          poetry run bandit -r modules/rv-android-core modules/rv-monitor-generator modules/rv-static-analysis modules/rv-llm -f txt --quiet --exit-zero >> quality_report.md || echo "Bandit analysis failed" >> quality_report.md
          echo '```' >> quality_report.md

          echo "### Unused Code Detected by Vulture" >> quality_report.md
          echo '```' >> quality_report.md
          cat vulture_report.txt >> quality_report.md || echo "Vulture analysis failed" >> quality_report.md
          echo '```' >> quality_report.md
        working-directory: rv-android
        continue-on-error: true
      
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: rv-android/quality_report.md
