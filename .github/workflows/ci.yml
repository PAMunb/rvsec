name: CI Pipeline
'on':
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Build Maven project
        run: mvn clean install -DskipTests -DskipMopAgent
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov flake8 pylint mypy bandit black safety
        working-directory: rv-android
      
      - name: Run code quality checks (informational)
        continue-on-error: true
        run: |
          echo "Running Flake8 checks..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "Running more comprehensive Flake8 checks (warnings only)..."
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
          echo "Running Pylint checks (warnings only)..."
          pylint --exit-zero --disable=all --enable=E,F,W,R $(find . -type f -name "*.py" | grep -v "__pycache__" | grep -v ".venv")
          
          echo "Running type checking with MyPy (warnings only)..."
          mypy --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs --check-untyped-defs --disallow-untyped-calls --warn-redundant-casts --warn-return-any --warn-unused-ignores --no-strict-optional --no-error-summary .
          
          echo "Running security checks with Bandit (warnings only)..."
          bandit -r . --format txt --quiet --exit-zero
          
          echo "Checking code formatting with Black (warnings only)..."
          black --check --diff . || true
          
          echo "Checking dependencies for security vulnerabilities (warnings only)..."
          safety check --full-report || true
        working-directory: rv-android
      
      - name: Run Python tests with coverage
        run: |
          PYTHONPATH=. pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term --cov-branch
        working-directory: rv-android
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            rv-android/coverage.xml
            rv-android/htmlcov/

      - name: Generate quality report
        if: always()
        run: |
          echo "# Python Quality Report" > quality_report.md
          echo "## Test Coverage Summary" >> quality_report.md
          echo '```' >> quality_report.md
          cat coverage.xml | grep -A 5 "<summary" >> quality_report.md || echo "No coverage summary available" >> quality_report.md
          echo '```' >> quality_report.md
          
          echo "## Code Quality Issues" >> quality_report.md
          echo "### Flake8 Issues (if any)" >> quality_report.md
          echo '```' >> quality_report.md
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics >> quality_report.md || echo "Flake8 analysis failed" >> quality_report.md
          echo '```' >> quality_report.md
          
          echo "### Security Issues (if any)" >> quality_report.md
          echo '```' >> quality_report.md
          bandit -r . -f txt --quiet --exit-zero >> quality_report.md || echo "Bandit analysis failed" >> quality_report.md
          echo '```' >> quality_report.md
        working-directory: rv-android
        continue-on-error: true
      
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: rv-android/quality_report.md
      