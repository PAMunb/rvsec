# Interpolated at process-test-resources, so these are the values the build actually saw.
#
# main.basedir is set by directory-maven-plugin at the initialize phase, by looking up
# br.unb.cic:rvsec-parent through the parent chain. ReactorBuildIT reads it back from here because a
# property that silently fails to resolve leaves the literal ${main.basedir} in the file, and every
# downstream module that writes its jar into rv-android/lib depends on it resolving.
main.basedir=${main.basedir}
project.version=${project.version}
